<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика Бота</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-size: 32px; 
            color: #38bdf8; 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); 
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .card .val { font-size: 32px; font-weight: bold; }
        .green { color: #10b981; }
        .red { color: #ef4444; }
        .blue { color: #3b82f6; }
        .orange { color: #f59e0b; }
        
        .chart-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            height: 350px;
            border: 1px solid #334155;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        th { background: #0f172a; color: #94a3b8; padding: 14px; text-align: left; font-size: 13px; text-transform: uppercase; }
        td { padding: 14px; border-bottom: 1px solid #334155; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #334155; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-win { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-lose { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .footer { text-align: center; color: #64748b; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 Статистика ПРЕМАТЧ-Бота</h1>
    </div>
    
    <div class="stats-grid">
        <div class="card">
            <h3>Общий профит</h3>
            <div class="val" id="total-profit">0.00</div>
        </div>
        <div class="card">
            <h3>ROI</h3>
            <div class="val" id="roi">0%</div>
        </div>
        <div class="card">
            <h3>Зашло / Не зашло</h3>
            <div class="val"><span class="green" id="wins">0</span> / <span class="red" id="loses">0</span></div>
        </div>
        <div class="card">
            <h3>Ожидают</h3>
            <div class="val orange" id="pendings">0</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="profitChart"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>Матч</th>
                <th>Лига</th>
                <th>Кэф</th>
                <th>Оценка</th>
                <th>Статус</th>
                <th>Профит</th>
            </tr>
        </thead>
        <tbody id="signals-table">
            <tr><td colspan="7" style="text-align:center; color:#94a3b8;">Загрузка данных...</td></tr>
        </tbody>
    </table>

    <div class="footer" id="updated">Последнее обновление: —</div>
</div>

<script>
    // Функция для форматирования времени
    function formatDate(ts) {
        if (!ts) return "-";
        const d = new Date(ts * 1000);
        return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    async function loadData() {
        try {
            // Делаем запрос к API твоего бота (нужно, чтобы бот отдавал данные)
            const response = await fetch('http://localhost:8000/api/signals'); 
            const data = await response.json();
            
            // Обновляем карточки
            const wins = data.filter(s => s.status === 'WIN').length;
            const loses = data.filter(s => s.status === 'LOSE').length;
            const pendings = data.filter(s => s.status === 'PENDING').length;
            const totalProfit = data.reduce((sum, s) => sum + s.profit, 0);
            const roi = (wins + loses) > 0 ? (totalProfit / (wins + loses) * 100) : 0;

            document.getElementById('total-profit').innerText = totalProfit.toFixed(2);
            document.getElementById('roi').innerText = roi.toFixed(1) + '%';
            document.getElementById('wins').innerText = wins;
            document.getElementById('loses').innerText = loses;
            document.getElementById('pendings').innerText = pendings;

            // Обновляем таблицу
            const tbody = document.getElementById('signals-table');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Пока нет сигналов</td></tr>';
            } else {
                data.forEach(s => {
                    let statusClass = 'badge-pending';
                    let statusText = 'PENDING';
                    if (s.status === 'WIN') { statusClass = 'badge-win'; statusText = 'WIN'; }
                    if (s.status === 'LOSE') { statusClass = 'badge-lose'; statusText = 'LOSE'; }
                    
                    let profitColor = s.profit > 0 ? 'green' : s.profit < 0 ? 'red' : '';

                    tbody.innerHTML += `
                        <tr>
                            <td>${formatDate(s.sent_at)}</td>
                            <td><strong>${s.match_name}</strong></td>
                            <td>${s.league}</td>
                            <td>${s.odds.toFixed(2)}</td>
                            <td>${s.score}/10</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td class="${profitColor}"><strong>${s.profit > 0 ? '+' : ''}${s.profit.toFixed(2)}</strong></td>
                        </tr>
                    `;
                });
            }

            document.getElementById('updated').innerText = 'Последнее обновление: ' + new Date().toLocaleTimeString('ru-RU');

        } catch (error) {
            console.error('Ошибка загрузки:', error);
            document.getElementById('updated').innerText = 'Ошибка подключения к боту';
        }
    }

    // Запускаем при загрузке
    loadData();
    // Обновляем каждые 10 секунд
    setInterval(loadData, 10000);
</script>
</body>
</html>
